services:
  - type: web
    name: fastbill-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Signs session tokens. Generated by Render so it never lives in git, and stable
      # across restarts so a deploy does not log every shopkeeper out.
      - key: JWT_SECRET
        generateValue: true
      # Flip to "true" once every installed app build sends a session token. Until then the
      # session checks run but do not block, so pre-session builds keep working.
      - key: AUTH_ENFORCE
        value: "false"
